<script>
/* Theme before first paint (no flash). Old links #a-#e and the old saved variant still open the matching theme. */
(function () {
  var T = ['horizon', 'nuit', 'doux', 'clair'], M = { a: 'horizon', b: 'horizon', c: 'doux', d: 'clair', e: 'nuit' }, th = 'horizon';
  try {
    var s = JSON.parse(localStorage.getItem('rythmo.v1') || 'null') || {}, st = s.settings || {};
    th = st.theme || M[String(s.variant || '').toLowerCase()] || 'horizon';
    var h = String(location.hash || '').slice(1).toLowerCase();
    if (M[h] && !st.themePicked) th = M[h];
    var hr = new Date().getHours();
    if (st.autoNight && (hr >= 21 || hr < 6)) th = 'nuit';
  } catch (e) {}
  document.documentElement.setAttribute('data-theme', T.indexOf(th) >= 0 ? th : 'horizon');
})();
</script>

<style>
/* ---------- Rythmo themes: tokens only (see themes.md). Switch with <html data-theme="horizon|nuit|doux|clair">. ---------- */
:root, [data-theme="horizon"] {
  color-scheme: light;
  --bg:#f4f3fb; --surface:#ffffff; --sunk:#ebe9f6;
  --sky-top:#e3e0f7; --sky-bottom:#f4f3fb;
  --ink:#1c2140; --muted:#565c7c;
  --line:#c9cde0; --line-strong:#7d83a3;
  --accent:#3f43b8; --on-accent:#ffffff; --accent-soft:#e4e6f8; --now:#3f43b8;
  --b-sleep:#3f43b8; --b-meal:#b4531f; --b-class:#4d5575; --b-sport:#0f7560;
  --b-travel:#6b5a2e; --b-task:#8a3f7a; --b-free:#2a6f9c;
  --warn:#8a4a00; --warn-soft:#fbecd0;
  --focus:#1a1a8c;
  --r-sm:8px; --r-md:14px; --r-lg:20px; --r-pill:999px;
  --shadow-1:0 1px 2px rgba(28,33,64,.06),0 4px 14px rgba(28,33,64,.07);
  --shadow-2:0 8px 28px rgba(28,33,64,.14);
  --block-tint:16%; --btn-radius:var(--r-md); --card-border:1px solid var(--line);
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:24px; --s-6:32px; --s-7:48px;
  --f-display:"Instrument Serif",Georgia,"Times New Roman",serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --fs-body:1rem; --fs-small:.875rem; --fs-h2:1.5rem; --fs-h1:2.125rem;
  --h-weight:400; --h-style:normal;
}
[data-theme="nuit"] {
  color-scheme: dark;
  --bg:#17141f; --surface:#221e2d; --sunk:#110f18;
  --sky-top:#2a2140; --sky-bottom:#17141f;
  --ink:#f4efe8; --muted:#c3bccd;
  --line:#3a3447; --line-strong:#8a8199;
  --accent:#f0b36a; --on-accent:#1d1408; --accent-soft:#3a2f27; --now:#f0b36a;
  --b-sleep:#b5a8ff; --b-meal:#ffa987; --b-class:#b9c0dc; --b-sport:#6fd8b4;
  --b-travel:#d9c27a; --b-task:#e9a0d6; --b-free:#8cc4ee;
  --warn:#ffc56e; --warn-soft:#3a2d18;
  --focus:#ffd9a0;
  --shadow-1:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
  --shadow-2:0 8px 28px rgba(0,0,0,.5);
  --block-tint:16%;
}
[data-theme="doux"] {
  color-scheme: light;
  --bg:#fbf5ec; --surface:#fffdf8; --sunk:#f3eadb;
  --sky-top:#f3e6f6; --sky-bottom:#fbf5ec;
  --ink:#33293a; --muted:#675c70;
  --line:#e6d9e4; --line-strong:#8d7f93;
  --accent:#7a4fb0; --on-accent:#ffffff; --accent-soft:#eee3f8; --now:#7a4fb0;
  --b-sleep:#7a4fb0; --b-meal:#b8562d; --b-class:#5f5a78; --b-sport:#2f7a55;
  --b-travel:#7a6330; --b-task:#a63e78; --b-free:#2f78a8;
  --warn:#7a4d00; --warn-soft:#fbefd2;
  --focus:#4b2a85;
  --r-sm:12px; --r-md:20px; --r-lg:24px; --btn-radius:var(--r-pill);
  --shadow-1:0 2px 0 rgba(51,41,58,.05),0 6px 18px rgba(90,60,110,.10);
  --shadow-2:0 10px 30px rgba(90,60,110,.18);
  --f-display:"Caveat","Comic Sans MS",cursive;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --fs-h2:1.75rem; --fs-h1:2.5rem; --h-weight:700;
}
[data-theme="clair"] {
  color-scheme: light;
  --bg:#ffffff; --surface:#ffffff; --sunk:#f3f5f7;
  --sky-top:#ffffff; --sky-bottom:#ffffff;
  --ink:#14181f; --muted:#4f5966;
  --line:#dde2e8; --line-strong:#6b7684;
  --accent:#1b5fd1; --on-accent:#ffffff; --accent-soft:#e6effc; --now:#1b5fd1;
  --b-sleep:#3c4bb8; --b-meal:#a85200; --b-class:#1f2733; --b-sport:#0b7352;
  --b-travel:#6e5a1a; --b-task:#8f2f73; --b-free:#0b6a9e;
  --warn:#8a4a00; --warn-soft:#fdeacc;
  --focus:#0b3fa8;
  --r-sm:4px; --r-md:8px; --r-lg:10px; --btn-radius:var(--r-md);
  --shadow-1:0 1px 2px rgba(20,24,31,.08); --shadow-2:0 6px 20px rgba(20,24,31,.14);
  --block-tint:12%;
  --f-display:"Figtree",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --h-weight:650;
}

/* ---------- Base ---------- */
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg);color:var(--ink);font:var(--fs-body)/1.5 var(--f-body);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.shell{max-width:560px;margin:0 auto;padding:12px 16px calc(112px + env(safe-area-inset-bottom,0px))}
h1,h2{font-family:var(--f-display);font-weight:var(--h-weight);font-style:var(--h-style);margin:0 0 var(--s-2);text-wrap:balance}
h1{font-size:var(--fs-h1);line-height:1.1}
h2{font-size:var(--fs-h2);line-height:1.15}
h3{font:600 1rem/1.3 var(--f-body);margin:0 0 var(--s-1)}
p{margin:0 0 var(--s-3)}
a{color:var(--accent)}
.sub,.muted{color:var(--muted)}
.small{font-size:var(--fs-small)}
.time{font-variant-numeric:tabular-nums}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:4px 0 12px}
.brand{display:flex;gap:8px;align-items:center;font:var(--h-weight) 1.75rem/1 var(--f-display);color:var(--ink)}
.lang{justify-self:start;width:max-content;display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r-pill);overflow:hidden;background:var(--surface)}
.lang button{background:none;border:0;min-width:48px;min-height:44px;padding:0 12px;font:600 .875rem var(--f-body);color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}

/* ---------- Components ---------- */
.card{background:var(--surface);border:var(--card-border);border-radius:var(--r-lg);box-shadow:var(--shadow-1);padding:var(--s-4);margin-bottom:var(--s-4);min-width:0}
.card>h2:first-child{margin-bottom:var(--s-3)}
.stack{display:grid;gap:var(--s-3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 var(--s-5);border-radius:var(--btn-radius);border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font:600 1rem var(--f-body);text-decoration:none;text-align:center}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.full{width:100%}
.btn.warnb{color:var(--warn);border-color:var(--warn)}
.btn[disabled]{opacity:.6;cursor:default}
.tbtn{background:none;border:0;min-height:44px;padding:0 4px;color:var(--accent);font:600 1rem var(--f-body);text-decoration:underline;text-underline-offset:3px;text-align:left}
.chips{display:flex;flex-wrap:wrap;gap:var(--s-2)}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 var(--s-3);border-radius:var(--r-pill);border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font:500 .9375rem var(--f-body)}
.chip[aria-pressed="true"],.chip[aria-current="date"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);font-weight:700}
.chip[aria-pressed="true"]::before{content:"✓";font-weight:700}
.chips.cb label{position:relative}
.chips.cb input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chips.cb span{display:inline-flex;align-items:center;min-height:44px;padding:0 var(--s-3);border:1px solid var(--line-strong);border-radius:var(--r-pill);background:var(--surface);font-size:.9375rem}
.chips.cb input:checked+span{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);font-weight:700}
.chips.cb input:checked+span::before{content:"✓ "}
.chips.cb input:focus-visible+span{outline:3px solid var(--focus);outline-offset:2px}
label.f{display:grid;gap:6px;font-weight:600}
label.f .hint,.hint{color:var(--muted);font-size:var(--fs-small);font-weight:400}
input[type=text],input[type=time],input[type=url],select,textarea{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface);color:var(--ink);font-size:1rem}
textarea{resize:vertical;line-height:1.4}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--s-3)}
.grid2>*{min-width:0}
input[type=time]{min-width:0}
.msg{min-height:1.5em;font-weight:600;color:var(--b-sport);margin:0 0 var(--s-2)}
.msg.err{color:var(--warn)}
.msg:empty{min-height:0;margin:0}
.warn{background:var(--warn-soft);color:var(--warn);border-radius:var(--r-md);padding:var(--s-3);font-weight:600;margin-bottom:var(--s-3)}
.tip{border:1px dashed var(--line-strong);border-radius:var(--r-md);padding:var(--s-3);color:var(--muted);margin-bottom:var(--s-4)}
.note{color:var(--muted);font-size:var(--fs-small);margin-top:var(--s-5)}
.cl{list-style:none;margin:0;padding:0;display:grid;gap:var(--s-2)}
.cl li{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:6px 6px 6px 12px}
.cl .m{min-width:0}
.cl .m b{display:block;overflow-wrap:anywhere;font-weight:600}
.cl .m small{color:var(--muted);font-size:var(--fs-small);font-variant-numeric:tabular-nums}
.x{background:none;border:0;min-height:44px;min-width:44px;padding:0 10px;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}
details.imp{margin-bottom:var(--s-3);border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface)}
details.imp>summary{cursor:pointer;font-weight:700;min-height:48px;display:flex;align-items:center;padding:0 var(--s-4)}
details.imp>.stack{padding:0 var(--s-4) var(--s-4)}

/* Day header (sky only here) */
.day-header{background:linear-gradient(var(--sky-top),var(--sky-bottom));border-radius:var(--r-lg);padding:var(--s-4) var(--s-4) var(--s-3);margin:0 -4px var(--s-4)}
.day-header h1{margin-bottom:var(--s-3)}
.eyebrow{font-weight:600;color:var(--muted);margin:0 0 2px}
.pills{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pills .chip{flex:0 0 auto}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s-2)}
.sum div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:8px 10px}
.sum span{display:block;color:var(--muted);font-size:var(--fs-small)}
.sum b{font:600 1.25rem/1.2 var(--f-body);font-variant-numeric:tabular-nums}

/* Day timeline */
.tl{list-style:none;margin:0 0 var(--s-4);padding:0;display:grid;gap:var(--s-2)}
.tl>li{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:start}
.tl .g{color:var(--muted);font-weight:600;padding-top:12px;text-align:right;font-variant-numeric:tabular-nums;font-size:.9375rem}
.block{--c:var(--b-free);display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:color-mix(in srgb,var(--c) var(--block-tint),var(--surface));border:1px solid transparent;border-left:4px solid var(--c);border-radius:var(--r-md);min-height:44px;padding:var(--s-2) var(--s-3);color:var(--ink);font:inherit}
.block.sleep{--c:var(--b-sleep)} .block.meal{--c:var(--b-meal)} .block.class{--c:var(--b-class)}
.block.sport{--c:var(--b-sport)} .block.travel{--c:var(--b-travel)} .block.task{--c:var(--b-task)} .block.free{--c:var(--b-free)}
.block.suggestion{border:1px dashed var(--c);border-left:4px solid var(--c)}
.block .ic{flex:0 0 auto;color:var(--c);display:grid;place-items:center}
.block .bd{flex:1 1 auto;min-width:0}
.block .ttl{display:block;font-weight:600;overflow-wrap:anywhere}
.block .hint{display:block}
.block .tag{display:inline-block;font-size:var(--fs-small);color:var(--muted);font-style:italic}
.block.travel,.block.class{padding-block:6px}
.tl>li.past .block{background:var(--sunk);border-left-color:var(--line-strong);border-color:transparent;border-left-color:var(--line-strong)}
.tl>li.past .block .ic{color:var(--muted)}
.tl>li.past .g{text-decoration:line-through;text-decoration-thickness:1px}
.cbx{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:600}
.cbx input{width:22px;height:22px;accent-color:var(--accent)}

/* Bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:4;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs div{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(var(--n,5),1fr)}
nav.tabs button{background:none;border:0;min-height:56px;padding:8px 2px 6px;display:grid;justify-items:center;gap:2px;font:600 .75rem var(--f-body);color:var(--muted)}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs button[aria-current="page"] svg{stroke-width:2.4}

/* Check-in */
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.seg button{min-height:48px;border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r-sm);font-weight:700}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.ends{display:flex;justify-content:space-between;font-size:var(--fs-small);color:var(--muted);margin-top:4px}
.stepper{display:flex;align-items:center;gap:16px}
.stepper .v{font:600 2rem/1 var(--f-body);min-width:3.2ch;text-align:center;font-variant-numeric:tabular-nums}
.rb{width:48px;height:48px;border-radius:50%;border:1px solid var(--line-strong);background:var(--surface);font:600 1.25rem/1 var(--f-body);color:var(--ink)}
.chart{position:relative;height:120px;display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;margin-top:6px}
.chart .b{display:grid;align-items:end;height:100%;position:relative}
.chart .b i{display:block;background:var(--b-sleep);border-radius:6px 6px 2px 2px;min-height:3px}
.chart .b i.none{background:none;border-bottom:2px dashed var(--line-strong);border-radius:0}
.chart .b em{position:absolute;left:0;right:0;text-align:center;font-size:.75rem;color:var(--muted);font-style:normal}
.goal{position:absolute;left:0;right:0;border-top:2px dashed var(--b-meal);pointer-events:none}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:6px;text-align:center;font-size:.8125rem;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-block:14px}
.stats div{background:var(--accent-soft);border-radius:var(--r-md);padding:10px;text-align:center}
.stats b{display:block;font:600 1.375rem var(--f-body);font-variant-numeric:tabular-nums}
.stats span{font-size:.8125rem;color:var(--muted)}
.empty{text-align:center;padding-block:24px 10px;display:grid;gap:12px}
.empty p{color:var(--muted);margin:0}

/* Settings: theme picker */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-3)}
@media (min-width:700px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{position:relative;display:block;cursor:pointer;border-radius:var(--r-md)}
.tile input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.tile .pv{display:grid;gap:5px;height:96px;padding:10px;border-radius:var(--r-md);background:var(--bg);color:var(--ink);border:2px solid var(--line);font-family:var(--f-body);overflow:hidden}
.tile .pv b{font:var(--h-weight) 1.25rem/1 var(--f-display);font-style:var(--h-style)}
.tile .pv .strip{background:var(--surface);border-radius:6px;padding:5px;display:flex;gap:4px;align-items:center}
.tile .pv .strip i{display:block;height:8px;border-radius:3px;flex:1}
.tile .pv .dot{width:12px;height:12px;border-radius:50%;background:var(--accent);flex:0 0 12px!important}
.tile .nm{display:flex;justify-content:space-between;align-items:center;font-weight:600;padding:6px 2px 0;min-height:32px}
.tile input:checked~.pv{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.tile input:checked~.nm::after{content:"✓";color:var(--accent);font-weight:800}
.tile input:focus-visible~.pv{outline:3px solid var(--focus);outline-offset:2px}
/* Toggle */
.tg{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;width:100%;background:none;border:0;padding:4px 0;text-align:left;color:var(--ink)}
.tg .lb{display:grid;gap:2px;font-weight:600}
.tg .tr{flex:0 0 52px;width:52px;height:32px;border-radius:var(--r-pill);border:1px solid var(--line-strong);background:var(--sunk);position:relative}
.tg .tr::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);border:1px solid var(--line-strong);display:grid;place-items:center;font-size:14px;line-height:22px;text-align:center}
.tg[aria-checked="true"] .tr{background:var(--accent);border-color:var(--accent)}
.tg[aria-checked="true"] .tr::after{left:23px;content:"✓";color:var(--accent);border-color:var(--surface)}
.tg .st{font-size:var(--fs-small);color:var(--muted);font-weight:500}


.block .pen{flex:0 0 44px;width:44px;height:44px;margin:-6px -8px -6px 0;display:grid;place-items:center;color:var(--muted)}
.block .pen svg{width:20px;height:20px}
button.block{cursor:pointer}
button.block:hover{border-color:var(--c)}
.block.moved .ttl::after{content:" •";color:var(--c)}
.tl>li.nowrow{align-items:center;grid-template-columns:52px 1fr}

function computeReminders(days) {

  calclear: () => { state.cal = null; save(); say(t('imp_removed')); },
  hintoff: () => { state.ui.reimportHintOff = true; save(); },
  hidesug: v => { state.hiddenSug = Object.assign({}, state.hiddenSug, { [v]: true }); save(); if (sheet && !sheet.panel) closeSheet(); },
  showsug: () => { state.hiddenSug = {}; save(); },
  addtask: () => { tab = 'week'; weekSub = 'courses'; msg = ''; scrollTask = true; },
  sporton: () => { state.settings.sportOn = !state.settings.sportOn; save(); },
  sportmin: v => { state.settings.sportMin = snapSport(v); save(); },
  sportwhen: v => { if (['morning', 'evening', 'any'].includes(v)) state.settings.sportWhen = v; save(); },
  obnext: () => { ob = Math.min(OB_N - 1, ob + 1); msg = ''; obFocus = true; window.scrollTo(0, 0); },
  obback: () => { ob = Math.max(0, ob - 1); msg = ''; obFocus = true; window.scrollTo(0, 0); },
  obskip: () => { finishOb(); },
  obdone: () => { finishOb(); if (state.classes.length) curDate = firstClassDate(); },
  obreplay: () => { obOn = true; ob = 0; msg = ''; window.scrollTo(0, 0); },
  rmtoggle: v => { if (state.reminders[v]) { state.reminders[v].on = !state.reminders[v].on; save(); } },
  rmon: () => { enableReminders().then(render); },
  rmoff: () => { state.reminders.enabled = false; save(); say(t('rm_off_msg')); },
  icsrem: () => { const n = computeReminders(7).length; if (!n) { say(t('rm_none'), true); return; } download('rythmo-rappels.ics', remindersICS(), 'text/calendar;charset=utf-8'); say(t('rm_cal_done', { n })); },
  icsplan: () => { download('rythmo-planning.ics', planICS(), 'text/calendar;charset=utf-8'); say(t('rm_plan_done')); },
  install: () => { if (installEvt) { installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; render(); }); } },
  todotoggle: v => { state.todos = state.todos.map(x => x.id === v ? Object.assign({}, x, { done: !x.done }) : x); save(); },
  tododel: v => { state.todos = state.todos.filter(x => x.id !== v); save(); },
  todoclear: () => { state.todos = state.todos.filter(x => !x.done); save(); },
  autonight: () => { state.settings.autoNight = !state.settings.autoNight; save(); },
  export: () => download('rythmo-donnees.json', JSON.stringify(state, null, 2), 'application/json'),
  reset: () => {
    if (!resetArm) { resetArm = true; return; }
    const lg = state.lang, th = state.settings.theme;
    state = freshState(); state.lang = lg; state.settings.theme = th;
    resetArm = false; tab = 'plan'; curDate = today(); draft = null; save(); obOn = true; ob = 0; // start again with the tutorial
  }
};
$app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || !$app.contains(b)) return;
  const a = b.dataset.act, f = ACT[a]; if (!f) return;
  if (a !== 'reset') resetArm = false;
  msg = ''; msgAt = null; // a new action never shows an old message
  f(b.dataset.v, b, e);
  render();
});
$app.addEventListener('toggle', e => { const d = e.target; if (d.tagName === 'DETAILS' && d.id) openSec[d.id] = d.open; }, true);
$app.addEventListener('submit', e => {
  const id = e.target.id, form = e.target; e.preventDefault();
  msg = ''; msgAt = null;
  if (id === 'quickf') {
    const s = document.getElementById('qs-s').value, en = document.getElementById('qs-e').value;
    const days = Array.from(document.querySelectorAll('input[name=qd]:checked')).map(x => +x.value);
    if (!s || !en || toMin(en) <= toMin(s)) { formError(form, t('sc_bad_time'), 'qs-e'); return; }
    if (!days.length) { formError(form, t('sc_need_day'), null); return; }
    state.settings.commute = +document.getElementById('qs-com').value;
    const S0 = toMin(s), E0 = toMin(en);
    state.classes = (S0 < 720 && E0 > 810)
      ? [{ id: uid(), title: t('qs_am'), start: s, end: '12:00', days, origin: 'manual' }, { id: uid(), title: t('qs_pm'), start: '13:30', end: en, days, origin: 'manual' }]
      : [{ id: uid(), title: t('sc_default'), start: s, end: en, days, origin: 'manual' }];
    state.cal = null;
    if (obOn) finishOb();
    state.sample = false; msg = ''; tab = 'plan'; curDate = firstClassDate(); save(); render(); return;
  }
  if (id === 'urlf') {
    const urls = (document.getElementById('icsurl').value || '').split(/[\s,;]+/).filter(Boolean).map(x => x.replace(/^webcals?:\/\//i, 'https://'));
    if (!urls.length || urls.some(x => !/^https?:\/\/\S+$/i.test(x))) { formError(form, t('sc_url_bad'), 'icsurl'); return; }
    busy = true; say(''); render();
    Promise.allSettled(urls.slice(0, 6).map(fetchICS)).then(rs => {
      const r = applyImport(rs.filter(x => x.status === 'fulfilled').map(x => x.value));
      if (!r.ok) { say(t(rs.some(x => x.status === 'fulfilled') ? 'lk_empty' : 'lk_fail'), true, 'link'); return; }
      if (obOn) finishOb();
      tab = 'plan'; curDate = firstClassDate(); save(); say(r.text);
    }).finally(() => { busy = false; render(); });
    return;
  }
  if (id === 'taskf') {
    const title = document.getElementById('tn').value.trim().slice(0, 40) || t('tk_default'), dur = +document.getElementById('td').value;
    const days = Array.from(document.querySelectorAll('input[name=td-d]:checked')).map(x => +x.value);
    if (!days.length) { formError(form, t('sc_need_day'), null); return; }
    state.tasks = state.tasks.concat([{ id: uid(), title, dur, days }]); save(); say(t('tk_added'), false, 'taskf'); render(); return;
  }
  if (id === 'sheetf') {
    const it = sheetItem(); if (!it) { sheet = null; render(); return; }
    const dk = sheet.d, v = id2 => (document.getElementById(id2) || {}).value || '';
    if (it.type === 'class' || it.type === 'appt') {
      const s0 = v('sh-s'), e0 = v('sh-e');
      if (!HHMM.test(s0) || !HHMM.test(e0) || toMin(e0) <= toMin(s0)) { formError(form, t('sc_bad_time'), 'sh-e'); return; }
      setOv(dk, o => {
        if (it.src === 'work') { o.work = Object.assign({}, o.work, { start: s0, end: e0 }); }
        else if (it.src === 'extra') o.add = (o.add || []).map(c => c.id === it.cid ? Object.assign({}, c, { start: s0, end: e0 }) : c);
        else { o.remove = o.remove || {}; o.remove[it.cid] = true; o.add = (o.add || []).concat([{ id: uid(), title: it.title, start: s0, end: e0, school: true }]); }
      });
    } else {
      const x = v('sh-t'); if (!HHMM.test(x)) { render(); return; }
      setOv(dk, o => { if (it.k === 'wake') o.wake = x; else if (it.k === 'bed') o.bed = x; else { o.at = o.at || {}; o.at[it.k] = x; if (o.skip) delete o.skip[it.k]; } });
    }
    say(t('edited_day')); closeSheet(); render(); return;
  }
  if (id === 'todof') {
    const el = document.getElementById('todo-in'), v = el.value.trim().slice(0, 80);
    if (v && state.todos.length < 30) { state.todos = state.todos.concat([{ id: uid(), text: v, done: false }]); save(); }
    render(); const n = document.getElementById('todo-in'); if (n) n.focus(); return;
  }
  if (id === 'workf') {
    const s0 = document.getElementById('wk-s').value, e0 = document.getElementById('wk-e').value, lb = document.getElementById('wk-l').value.trim().slice(0, 40);
    if (!HHMM.test(s0) || !HHMM.test(e0) || toMin(e0) <= toMin(s0)) { formError(form, t('sc_bad_time'), 'wk-e'); return; }
    setOv(key(curDate), o => { o.kind = 'work'; o.work = { label: lb, start: s0, end: e0 }; }); say(t('edited_day')); render(); return;
  }
  if (id === 'dayaddf') {
    const title = document.getElementById('da-n').value.trim().slice(0, 40) || t('sc_default');
    const s0 = document.getElementById('da-s').value, e0 = document.getElementById('da-e').value;
    if (!HHMM.test(s0) || !HHMM.test(e0) || toMin(e0) <= toMin(s0)) { formError(form, t('sc_bad_time'), 'da-e'); return; }
    const school = !!(document.getElementById('da-school') || {}).checked;
    setOv(key(curDate), o => { o.add = (o.add || []).concat([{ id: uid(), title, start: s0, end: e0, school }]); }); say(t('edited_day')); render(); return;
  }
  if (id === 'addf') {
    const title = document.getElementById('cn').value.trim().slice(0, 40) || t('sc_default');
    const start = document.getElementById('cs').value, end = document.getElementById('ce').value;
    const days = Array.from(document.querySelectorAll('input[name=cd]:checked')).map(x => +x.value);
    if (!start || !end || toMin(end) <= toMin(start)) { formError(form, t('sc_bad_time'), 'ce'); return; }
    if (!days.length) { formError(form, t('sc_need_day'), null); return; }
    if (state.sample) { state.classes = state.classes.filter(c => c.origin !== 'sample'); state.sample = false; }
    state.classes.push({ id: uid(), title, start, end, days, origin: 'manual' }); save(); say(t('sc_added'), false, 'addf'); render();
  }
});
$app.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'ics' && el.files && el.files[0]) {
    el.files[0].text().then(txt => {
      const r = applyImport([txt]);
      if (!r.ok) say(t('sc_import_none'), true);
      else { if (obOn) finishOb(); save(); say(r.text); if (tab === 'plan') curDate = firstClassDate(); }
      render();
    }).catch(() => { say(t('sc_import_err'), true); render(); });
    return;
  }
  if (el.id === 'note') { state.note = String(el.value).slice(0, 2000); save(); return; } // saved on change/blur, no re-render (keeps focus)
  if (el.dataset && el.dataset.rm) {
    const R = state.reminders[el.dataset.rm];
    if (el.dataset.rm === 'checkin') { if (HHMM.test(el.value) && toMin(el.value) >= 1080) R.time = el.value; }
    else R.before = +el.value;
    save(); render(); return;
  }
  if (el.name === 'theme' && THEMES.includes(el.value)) { state.settings.theme = el.value; state.settings.themePicked = true; save(); render(); return; }
  const k = el.dataset && el.dataset.set; if (!k) return;
  if (k === 'bedCap') { if (BEDCAPS.includes(el.value)) state.settings.bedCap = el.value; }
  else state.settings[k] = k === 'freeWake' ? (HHMM.test(el.value) ? el.value : '08:00') : +el.value;
  save(); render();
});

/* ===================== BOOT ===================== */
(function legacyHash() {
  const h = String(location.hash || '').slice(1).toLowerCase();
  if (LEGACY[h]) {
    if (!state.settings.themePicked) state.settings.theme = LEGACY[h];
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  }
})();
save();
obOn = !state.onboarded;
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('./sw.js', { scope: './' }).then(() => queueSchedule()).catch(() => {});
}
if (!readHash() && state.classes.length) curDate = firstClassDate();
try { history.replaceState(null, '', '#' + routeHash()); } catch (e) {}
/* Test/debug handle (read-only helpers, no data leaves the page). */
window.Rythmo = { computeDay, classesOn, importICS, calFromICS, applyImport, eventsFromICS, parseICS, key, parseKey, computeReminders, remindersICS, planICS, get state() { return state; } };
render();
})();
</script>
</body>
